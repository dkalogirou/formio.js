name: AFSE forms

on:
  push:
    paths: ['afse/**', '.github/workflows/afse-forms.yml']
  pull_request:
    paths: ['afse/**', '.github/workflows/afse-forms.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: afse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: afse/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build -w afse-formio-playground
      - name: Mobile end-to-end (form page, and the demo app with react-native-web)
        run: |
          npx -w afse-formio-react-native playwright install --with-deps chromium
          npm run e2e
      - name: Mobile app bundles for Android and iOS
        run: npm run bundle:check -w afse-formio-mobile-playground
        env:
          EXPO_OFFLINE: '1'
