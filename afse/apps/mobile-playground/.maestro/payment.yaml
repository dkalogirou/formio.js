# Device end-to-end test (Maestro, https://maestro.mobile.dev).
# Run against a dev build: npm run android, then npm run e2e:device
appId: eu.afse.forms.playground
---
- launchApp
- extendedWaitUntil:
    visible: "Beneficiary"
    timeout: 20000
- tapOn: "Pay"
- assertVisible: "Beneficiary is required"
- tapOn: "Fill sample"
- tapOn: "Pay"
- assertVisible:
    id: "payment-done"
- assertVisible: "GR1601101250000000012300695"
- tapOn: "New payment"
- tapOn:
    id: "toggle-language"
- tapOn: "Pay"
- assertVisible: "Το πεδίο Beneficiary είναι υποχρεωτικό"
